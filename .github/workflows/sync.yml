name: 同步 Bitget 数据
on:
  schedule:
    - cron: '*/20 * * * *'   # 每 20 分钟（UTC）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/fetch.mjs
        env:
          BITGET_KEY: ${{ secrets.BITGET_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}

      - name: 提交数据
        id: commit
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "数据同步 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 注意：GITHUB_TOKEN 的推送不会触发其他工作流，因此这里直接部署
      - name: 部署页面
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上传站点
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
