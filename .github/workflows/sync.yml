name: 同步 Bitget 数据
on:
  schedule:
    - cron: '*/20 * * * *'   # 每 20 分钟
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/fetch.mjs
        env:
          BITGET_KEY: ${{ secrets.BITGET_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
      - name: 提交并推送
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "数据同步 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
