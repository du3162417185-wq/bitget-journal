<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作者复盘 · 本地编辑器</title>
<style>
:root { --bg:#0b0e11; --panel:#14181d; --panel2:#1b2026; --border:#272e37; --text:#eaecef; --dim:#848e9c; --up:#2ebd85; --down:#f6465d; --accent:#f7c945; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; font-size:14px; padding:20px; }
.top { max-width:1200px; margin:0 auto 16px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
h1 { font-size:18px; margin-bottom:4px; }
.sub { color:var(--dim); font-size:12px; line-height:1.6; }
.toolbar { display:flex; align-items:center; gap:10px; }
.sync-state { color:var(--dim); font-size:12px; }
.layout { display:grid; grid-template-columns:380px 1fr; gap:16px; max-width:1200px; margin:0 auto; }
@media (max-width:900px){ .layout{grid-template-columns:1fr;} .list{max-height:46vh!important;} }
.card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; }
.search { width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 10px; font-size:13px; outline:none; margin-bottom:10px; font-family:inherit; }
.search:focus, textarea:focus { border-color:var(--accent); }
.list { max-height:72vh; overflow-y:auto; }
.item { padding:9px 10px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center; }
.item:hover, .item.sel { border-color:var(--accent); }
.item.sel { background:rgba(247,201,69,.07); }
.item .l { display:flex; flex-direction:column; gap:2px; min-width:0; }
.item .s1 { font-weight:600; font-size:13px; }
.item .s2 { color:var(--dim); font-size:11px; }
.pos{color:var(--up);} .neg{color:var(--down);} .has-rv{font-size:11px;color:var(--accent);}
.editor .meta { color:var(--dim); font-size:12px; line-height:1.8; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:10px; }
textarea { width:100%; height:320px; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:12px; font-size:14px; line-height:1.8; resize:vertical; outline:none; font-family:inherit; }
.actions { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
button { font-family:inherit; cursor:pointer; }
button.primary { background:var(--accent); color:#111; border:none; border-radius:8px; padding:9px 22px; font-size:13px; font-weight:600; }
button.secondary { background:none; border:1px solid var(--border); color:var(--dim); border-radius:8px; padding:8px 14px; font-size:12px; }
button:hover { filter:brightness(1.08); }
button:disabled { opacity:.4; cursor:not-allowed; }
.msg { font-size:12px; line-height:1.6; }
.empty { color:var(--dim); text-align:center; padding:60px 0; }
.hint { color:var(--dim); font-size:12px; margin-top:10px; line-height:1.7; }
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>📝 作者复盘编辑器</h1>
    <div class="sub">仅通过本机 GitHub 凭证写入 · 保存前自动同步最新交易 · 全部平仓按时间倒序</div>
  </div>
  <div class="toolbar">
    <span class="sync-state" id="syncState">正在读取本地数据…</span>
    <button class="secondary" id="refresh" type="button">同步最新交易</button>
  </div>
</div>
<div class="layout">
  <div class="card">
    <input class="search" id="q" placeholder="搜索币种，如 BTC / NVDA…" autocomplete="off">
    <div class="list" id="list"><div class="empty">加载中…</div></div>
  </div>
  <div class="card editor">
    <div id="noSel" class="empty">← 点击左侧任意一笔平仓<br>开始写你的复盘</div>
    <div id="panel" hidden>
      <div class="meta" id="meta"></div>
      <textarea id="text" maxlength="5000" placeholder="这笔交易的逻辑是什么？进场理由、出场理由、做对了什么、做错了什么、下次怎么改进…&#10;&#10;（留空保存 = 删除该笔复盘）"></textarea>
      <div class="actions">
        <button class="primary" id="save" type="button">保存并推送</button>
        <button class="secondary" id="clear" type="button">清空编辑框</button>
        <span class="msg" id="msg"></span>
      </div>
    </div>
    <div class="hint">保存会先检查工作区、同步远端 main，再写入并推送。若项目还有未提交代码，工具会停下并明确提示，不会覆盖它们。</div>
  </div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
let closes = [], reviews = {}, sel = null, dirty = false;
const keyOf = (p) => `${p.symbol}|${p.posSide || ''}|${Math.floor(Number(p.updatedTime || p.createdTime || 0) / 1000)}`;
const fmt = (n, dp=2) => (Number(n)>0?'+':'') + Number(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const dt = (ms) => ms ? new Date(Number(ms)).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}) : '–';
const cls = (n) => Number(n)>0?'pos':Number(n)<0?'neg':'';
const esc = (s) => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setMessage = (text, kind='') => { $('#msg').textContent=text; $('#msg').style.color=kind==='ok'?'var(--up)':kind==='err'?'var(--down)':''; };

async function api(path, body={}) {
  const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  let result;
  try { result = await response.json(); } catch { result = {ok:false,message:`HTTP ${response.status}`}; }
  if (!response.ok || !result.ok) throw new Error(result.message || `HTTP ${response.status}`);
  return result;
}

async function loadData() {
  const [a,b] = await Promise.all([
    fetch(`data/data.json?t=${Date.now()}`),
    fetch(`data/reviews.json?t=${Date.now()}`).catch(()=>null),
  ]);
  if (!a.ok) throw new Error('读取交易数据失败');
  const data = await a.json();
  try { reviews = b && b.ok ? await b.json() : {}; } catch { reviews = {}; }
  closes = [...(data.historyPositions||[])].sort((x,y)=>Number(y.updatedTime)-Number(x.updatedTime));
  $('#syncState').textContent = `${closes.length} 笔平仓 · 数据更新于 ${dt(data.meta?.generatedAtMs)}`;
  renderList();
}

async function refreshRemote() {
  if (dirty && !confirm('编辑框有尚未保存的内容，仍要刷新吗？')) return;
  const button = $('#refresh');
  button.disabled = true;
  $('#syncState').textContent = '正在同步 GitHub 最新数据…';
  try {
    const result = await api('/api/refresh');
    await loadData();
    setMessage(result.message, 'ok');
  } catch (error) {
    $('#syncState').textContent = '同步未完成';
    setMessage(error.message, 'err');
  } finally { button.disabled = false; }
}

function renderList() {
  const q = $('#q').value.trim().toUpperCase();
  const list = closes.filter(p => !q || String(p.symbol).toUpperCase().includes(q));
  $('#list').innerHTML = list.map(p => {
    const k = keyOf(p);
    return `<div class="item ${sel===k?'sel':''}" data-k="${esc(k)}">
      <div class="l">
        <span class="s1">${esc(String(p.symbol).replace(/USDT$/,''))} ${p.posSide==='long'?'多':'空'} ${reviews[k]?'<span class="has-rv">📝 已复盘</span>':''}</span>
        <span class="s2">${dt(p.updatedTime)} 平仓 · 开 ${p.openPriceAvg??'–'} → 平 ${p.closePriceAvg??'–'}</span>
      </div>
      <span class="s1 ${cls(p.netProfit)}">${fmt(p.netProfit)}</span>
    </div>`;
  }).join('') || '<div class="empty">无匹配记录</div>';
  document.querySelectorAll('#list .item').forEach(el => el.onclick = () => pick(el.dataset.k));
}

function pick(k) {
  if (dirty && sel !== k && !confirm('当前复盘尚未保存，确定切换交易吗？')) return;
  sel = k; dirty = false;
  const p = closes.find(x => keyOf(x) === k);
  if (!p) return;
  $('#noSel').hidden = true; $('#panel').hidden = false;
  $('#meta').innerHTML = `${esc(p.symbol)} ${p.posSide==='long'?'多':'空'} · ${dt(p.createdTime)} 开仓 → ${dt(p.updatedTime)} 平仓 · 数量 ${esc(p.closeTotalPos)} · 净盈亏 <b class="${cls(p.netProfit)}">${fmt(p.netProfit)} USDT</b>${reviews[k]?`<br>已有复盘（写于 ${dt(reviews[k].time)}），下方可修改`:'<br>尚无复盘'}`;
  $('#text').value = reviews[k]?.text || '';
  setMessage('');
  renderList();
}

$('#q').addEventListener('input', renderList);
$('#text').addEventListener('input', () => { dirty = true; });
$('#clear').onclick = () => { $('#text').value=''; dirty=true; $('#text').focus(); };
$('#refresh').onclick = refreshRemote;
$('#save').onclick = async () => {
  if (!sel) return;
  const value = $('#text').value.trim();
  if (!value && reviews[sel] && !confirm('确定删除这笔交易已有的复盘吗？')) return;
  const button = $('#save'); button.disabled=true; setMessage('正在同步并保存…');
  try {
    const p = closes.find(x => keyOf(x) === sel);
    const result = await api('/api/save', {key:sel,text:$('#text').value,symbol:p?.symbol});
    if (value) reviews[sel]={text:value,time:Date.now(),symbol:p?.symbol}; else delete reviews[sel];
    dirty=false; setMessage(`✓ ${result.message}`, 'ok'); renderList();
  } catch (error) { setMessage(`✗ ${error.message}`, 'err'); }
  finally { button.disabled=false; }
};

loadData().catch(error => { $('#list').innerHTML=`<div class="empty">${esc(error.message)}</div>`; $('#syncState').textContent='数据读取失败'; });
</script>
</body>
</html>
